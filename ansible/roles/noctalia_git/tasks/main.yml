- name: Check if noctalia-git is installed
  ansible.builtin.command: pacman -Q noctalia-git 
  register: noctalia_check
  changed_when: false
  failed_when: noctalia_check.rc not in [0, 1]

- name: Install noctalia-git AUR packages
  ansible.builtin.shell: paru -S --needed --noconfirm --overwrite "*" --mflags "--skippgpcheck" noctalia-git
  become: false
  when: noctalia_check.rc != 0


- name: Create wallpapers directory
  become: false
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Pictures/Wallpapers"
    state: directory

- name: Copy noctalia wallpaper
  become: false
  ansible.builtin.copy:
    src: noctalia-wallpaper.png
    dest: "{{ ansible_env.HOME }}/Pictures/Wallpapers/nordic.jpeg"