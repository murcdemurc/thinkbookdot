- name: Install essential packages
  become: true
  ansible.builtin.package:
    name:
      - git
      - curl
      - base-devel

      - pipewire
      - wireplumber
      - pipewire-pulse
      - mesa
      - power-profiles-daemon
      - bluez

      - mako
      - sddm
      - niri
      - ttf-jetbrains-mono-nerd
      - ghostty
      - alacritty
      - dolphin

    state: present

- name: Ensure /etc/sudoers.d exists
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: '0750'

- name: Copy sudoers rule for paru
  become: true
  ansible.builtin.copy:
    content: "{{ ansible_env.USER }} ALL=(ALL) NOPASSWD: /usr/bin/pacman, /usr/bin/paru\n"
    dest: /etc/sudoers.d/10-murc-paru
    mode: '0440'
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Remove old sudoers file from chezmoi source
  become: false
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/chezmoi/etc_sudoers.d/10-murc-paru"
    state: absent

- name: Check if paru is installed
  ansible.builtin.command:
    cmd: which paru
  register: paru_check
  failed_when: false
  changed_when: false
  become: false

- name: Clone paru repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru.git
    dest: "{{ ansible_env.HOME }}/paru"
  when: paru_check.rc != 0
  become: false

- name: Build and install paru
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: "{{ ansible_env.HOME }}/paru"
  when: paru_check.rc != 0
  become: false

- name: Remove paru build directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/paru"
    state: absent
  when: paru_check.rc != 0
  become: false
