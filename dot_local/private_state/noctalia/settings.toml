config_version = 12

[accessibility]
ui_scale = 0.90000000596046448

[backdrop]
blur_intensity = 0.04999999888241291
tint_intensity = 0.04999999888241291

[bar.default]
background_opacity = 0.79999998211860657
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "media", "tray", "network", "bluetooth", "widget", "brightness", "battery", "control-center", "session" ]
font_weight = 400
margin_ends = 0
position = "left"
radius = 0
radius_bottom_left = 0
radius_top_left = 0
start = [ "clock", "launcher" ]
thickness = 28

[battery]
warning_threshold = 20

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.24999999441206455
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 745.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[nightlight]
enabled = true
temperature_day = 7500
temperature_night = 4500

[plugins]
enabled = [ "blackbartblues/audio-switcher" ]

[shell]
corner_radius_scale = 0.80000001192092896
font_family = "JetBrainsMono NF"
lang = "en"
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 1.9500000290572643

    [shell.panel]
    launcher_position = "top_center"
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

[theme]
builtin = "Dracula"
community_palette = "Everforest"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "spicetify", "fuzzel" ]

[wallpaper]
directory = "/home/murc/Pictures/Wallpaper"

    [wallpaper.default]
    path = "/home/murc/Pictures/Wallpapers/nordic.jpeg"

    [wallpaper.last]
    path = "/home/murc/Pictures/Wallpapers/nordic.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/murc/Pictures/Wallpapers/nordic.jpeg"

    [[wallpaper.favorite]]
    community_palette = "Everforest"
    palette_source = "community"
    path = "/home/murc/Pictures/Wallpapers/nordic.jpeg"
    theme_mode = "auto"

[widget.clock]
scale = 1.1500000000000001

[widget.control-center]
glyph = "apps-filled"
scale = 1.25

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.session]
scale = 1.25

[widget.tray]
match_adjacent_spacing = true

[widget.wallpaper]
enabled = false

[widget.widget]
type = "blackbartblues/audio-switcher:widget"